<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Monitoring</title>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-left">
          <h1>Network Monitoring Dashboard</h1>
          <div class="header-controls">
            <div class="control-group">
              <label for="time-range">Time Range:</label>
              <select id="time-range">
                <option value="3600">Last Hour</option>
                <option value="10800">Last 3 Hours</option>
                <option value="21600">Last 6 Hours</option>
                <option value="43200" selected>Last 12 Hours</option>
                <option value="86400">Last 24 Hours</option>
              </select>
            </div>
            
            <div class="control-group">
              <label>
                <input type="checkbox" id="live-mode" checked />
                Live Mode
              </label>
            </div>

            <div class="control-group">
              <button id="jump-to-now" class="jump-button">Jump to Now</button>
            </div>
          </div>
        </div>
        
        <div class="header-right">
          <span id="connection-status" class="status-disconnected">Disconnected</span>
          <span id="data-stats"></span>
        </div>
      </header>
      
      <main>
        <div class="main-grid">
          <div class="sidebar-card" id="metrics-sidebar">
            <h3>Metrics</h3>
            <div id="metrics-list"></div>
          </div>
          
          <div id="chart-container">
            <div id="chart"></div>
          </div>
          
          <div class="sidebar-card">
            <h3>Events</h3>
            <div id="events-list"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
