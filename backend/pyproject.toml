[project]
name = "monitoring-backend"
version = "1.0.0"
description = "Network monitoring simulator backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "apscheduler>=3.10.4",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]
